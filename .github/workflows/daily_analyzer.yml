name: Product Hunt Daily Analyzer

on:
  schedule:
    # 毎日 日本時間 06:35 (UTC 21:35) に自動実行 (毎時00分の世界的な混雑遅延を回避し、07:00前に確実に完了させる)
    - cron: '35 21 * * *'
  workflow_dispatch: # GitHub画面からの手動実行ボタン

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  analyze-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Analyzer
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DAILY_FETCH_LIMIT: 10
        run: |
          python run_daily.py

      - name: Prepare Pages Artifact
        run: |
          mkdir -p public
          cp dashboard.html public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit & Push reports and database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated daily analysis: update reports and history"
          file_pattern: "reports/*.md data/*.db dashboard.html docs/index.html index.html"
