name: Product Hunt Diagnostic Runner (Actions)

# 【ローカル原本運用方針（第3回 指摘3対応）】
# 日次分析・DB永続化・Threads自動投稿・本番PagesデプロイはローカルWindows環境を正本（Primary Engine）とします。
# 本ワークフローはクラウド環境での依存関係・API疎通を確認するための「診断・テスト専用」として保持され、
# 本番SNSへの自動投稿（THREADS_AUTO_PUBLISH: 'false'）やGitHub Pagesの上書き、本番ファイルの自動コミットは行いません。

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '取得件数（テスト用）'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  diagnostic-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Safe Diagnostic Pipeline
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_MEMBER_PASSWORD: ${{ secrets.DASHBOARD_MEMBER_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          DAILY_FETCH_LIMIT: ${{ github.event.inputs.limit || '3' }}
          # 【安全弁】クラウドからのSNS投稿を恒久無効化
          THREADS_AUTO_PUBLISH: 'false'
          THREADS_MAX_DAILY_POSTS: 0
        run: |
          echo "Running diagnostic pipeline in mock/isolated mode..."
          # モックモードで安全に実行し、本番SNS・本番成果物への影響を完全防止
          python run_daily.py --mock --limit ${{ github.event.inputs.limit || '3' }}

